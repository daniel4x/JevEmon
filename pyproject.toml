[project]
name = "jevemon"
version = "0.1.0"
description = "Jev walks a real FireRed ROM, picking a destination each leg."
requires-python = ">=3.12"
dependencies = ["requests"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jevemon"]

[tool.setuptools.package-data]
jevemon = ["ui/*.html"]
